# =============================================================================
# Günlük AI Haber Toplayıcı — Yapılandırma
# Yeni kaynak eklemek veya çıkarmak için yalnızca bu dosyayı düzenleyin.
# =============================================================================

sources:
  - name: "arXiv AI"
    url: "https://rss.arxiv.org/rss/cs.AI"
    enabled: true
    max_items: 10

  - name: "OpenAI Blog"
    url: "https://openai.com/blog/rss.xml"
    enabled: true
    max_items: 10

  - name: "The Decoder"
    url: "https://the-decoder.com/feed/"
    enabled: true
    max_items: 10
    # Not: Anthropic RSS kaldırdı (tüm URL'ler 404). Yerine The Decoder eklendi.

  - name: "Hacker News"
    url: "https://news.ycombinator.com/rss"
    enabled: true
    max_items: 10

  - name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    enabled: true
    max_items: 10

# -----------------------------------------------------------------------------
# Kategoriler — LLM'in atayabileceği tüm geçerli değerler.
# Son eleman "Genel" her zaman fallback olarak kullanılır; kaldırmayın.
# -----------------------------------------------------------------------------
categories:
  - "Araştırma"
  - "Mühendislik/Mimari"
  - "Ürün/Şirket Haberleri"
  - "Kullanıcıyı Etkileyen"
  - "Regülasyon/Politika"
  - "Yatırım/Startup"
  - "Açık Kaynak"
  - "Genel"

# -----------------------------------------------------------------------------
# LLM ayarları
# -----------------------------------------------------------------------------
llm:
  model: "gemini-3.5-flash-lite"
  batch_size: 20          # Tek API çağrısında kaç haber gönderileceği
  max_retries: 3          # 429 / geçici hata durumunda maksimum yeniden deneme

# -----------------------------------------------------------------------------
# Veri yönetimi
# -----------------------------------------------------------------------------
history_days: 7           # Kaç günlük haber geçmişte tutulsun
summary_max_chars: 300    # Özet metninin maksimum karakter sayısı
output_max_kb: 500        # Üretilen HTML'nin maksimum boyutu (KB)

# -----------------------------------------------------------------------------
# Dosya yolları (proje kökünden göreli)
# -----------------------------------------------------------------------------
paths:
  history: "data/history.json"
  output_html: "docs/index.html"
  template: "templates/index.html.j2"
